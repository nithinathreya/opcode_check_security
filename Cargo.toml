[package]
name = "aegis-cli"
version = "0.3.0"
edition = "2021"
description = "CLI tool for Static/Dynamic Opcode Verification & Behavioral MicroVM Sandboxing (x86_64 & ARM64)"
authors = ["AegisVM Security Team"]

[lib]
name = "aegis_cli"
path = "src/lib.rs"

[[bin]]
name = "aegis-cli"
path = "src/main.rs"

[dependencies]
# CLI Argument Parsing & Terminal Formatting
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Binary Parsing, Cryptography & Multi-Architecture Disassembly
goblin = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
iced-x86 = { version = "1.21", features = ["decoder", "instr_info"] }
bad64 = "0.6"
petgraph = { version = "0.6", features = ["graphmap"] }
